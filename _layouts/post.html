---
layout: default
---
<article>
  <header class="post-header">
    <span class="post-date">{{ page.date | date: "%d %b %Y" }}</span>
    <h1>{{ page.title }}</h1>
    {% if page.tags %}
    <div class="post-tags">
      {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
    </div>
    {% endif %}
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
